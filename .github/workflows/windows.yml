name: Windows CPU

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: python tools/bootstrap.py --python 3.12
      - run: uv run --no-sync ruff check packages
      - run: uv run --no-sync pytest --junitxml=windows-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-cpu-test-results
          path: windows-tests.xml
          if-no-files-found: warn
