[project]
name = "arrayroute"
version = "0.1.36"
description = "Measured, bounded selections over scientific chunked arrays"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
expressions = ["numexpr>=2.14.2,<3"]
profiling = ["psutil>=7.2,<8"]
zarr = ["zarr>=3.1"]
tensorstore = ["tensorstore>=0.1.76"]
zarrista = ["zarrista>=0.1,<0.2"]
snapshots = ["boto3>=1.40", "icechunk>=2.3,<3; python_version >= '3.12'", "zarr>=3.1"]
benchmark = ["zarr>=3.1; python_version < '3.12'", "zarr>=3.3; python_version >= '3.12'", "tensorstore>=0.1.76", "zarrista>=0.1,<0.2", "icechunk>=2.3,<3; python_version >= '3.12'"]
codecs = ["numcodecs>=0.16"]
disk-cache = ["diskcache>=5.6.3,<6", "filelock>=4.1,<5"]
gpu-codecs = ["numcodecs>=0.16", "cupy-cuda12x>=14", "nvidia-nvcomp-cu12>=6,<7"]
test = ["numexpr>=2.14.2,<3", "psutil>=7.2,<8", "boto3>=1.40", "pytest>=8", "zarr>=3.1", "tensorstore>=0.1.76", "zarrista>=0.1,<0.2", "diskcache>=5.6.3,<6", "filelock>=4.1,<5", "icechunk>=2.3,<3; python_version >= '3.12'"]

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"
