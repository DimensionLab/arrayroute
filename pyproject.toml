# Generated by DimensionLab's export tooling (uv workspace root for this repository).
[project]
name = "arrayroute-workspace"
version = "0.0.0"
description = "uv workspace root of arrayroute"
requires-python = ">=3.11,<3.14"
dependencies = ["arrayroute"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.13", "pyright>=1.1.400"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/arrayroute/"]

[tool.uv.sources]
arrayroute = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.ruff.lint.isort]
known-first-party = ["arrayroute", "frontier", "frontier_agent", "frontier_connectors", "frontier_data", "frontier_deploy", "frontier_eval", "frontier_examples", "frontier_explain", "frontier_hub", "frontier_physicsnemo", "frontier_planner", "frontier_plugins", "frontier_prep", "frontier_profiler", "frontier_train"]

[tool.pytest.ini_options]
testpaths = ["packages/arrayroute/"]
addopts = "-q --import-mode=importlib"
